<style>
*{box-sizing:border-box}body{margin:0;background:#080b14;color:#fff;font-family:system-ui,Segoe UI,sans-serif;display:flex;justify-content:center;min-height:100vh}
.wrap{width:min(960px,100%);padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:24px;margin:0}.stats{display:flex;gap:18px;font-weight:700}.game{position:relative;background:#111;border-radius:18px;overflow:hidden;box-shadow:0 12px 45px #0008}
canvas{display:block;width:100%;height:auto;background:#18202b}.help{text-align:center;opacity:.8;padding:10px;font-size:14px}
button{border:0;border-radius:10px;padding:9px 14px;background:#fff;color:#111;font-weight:800;cursor:pointer}
#msg{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:900;text-shadow:0 3px 10px #000;pointer-events:none}

<body>
<div class="wrap">
  <div class="top"><h1>🏁 NEON APEX</h1><div class="stats"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span><button id="restart">Restart</button></div></div>
  <div class="game"><canvas id="c" width="900" height="600"></canvas><div id="msg"></div></div>
  <div class="help">Arrow keys / WASD to steer • Dodge traffic • Survive as long as you can</div>
</div>
<script>
const c=document.querySelector('#c'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),msg=document.querySelector('#msg');
let keys={},score=0,best=+localStorage.neonBest||0,dead=false,t=0,speed=6,roadX=450,lanes=[310,450,590],player={x:450,y:500,w:42,h:72};
let cars=[];
bestEl.textContent=best;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelector('#restart').onclick=start;
function start(){score=0;speed=6;cars=[];dead=false;t=0;player.x=450;msg.textContent='';requestAnimationFrame(loop)}
function car(px,py,enemy=true){return{x:px,y:py,w:42,h:72,col:enemy?['#ff3864','#ffb000','#48e0ff','#a66cff'][Math.floor(Math.random()*4)]:'#28e07b'}}
function drawCar(a){x.save();x.translate(a.x,a.y);x.fillStyle=a.col;x.shadowBlur=12;x.shadowColor=a.col;x.fillRect(-a.w/2,-a.h/2,a.w,a.h);x.shadowBlur=0;x.fillStyle='#dff7ff';x.fillRect(-15,-25,30,14);x.fillStyle='#101522';x.fillRect(-15,12,30,15);x.fillStyle='#05070b';x.fillRect(-23,-25,7,15);x.fillRect(16,-25,7,15);x.fillRect(-23,18,7,15);x.fillRect(16,18,7,15);x.restore()}
function loop(){if(dead)return; t++; score=Math.floor(t/6);scoreEl.textContent=score;if(score>best){best=score;localStorage.neonBest=best;bestEl.textContent=best}speed=6+Math.min(7,score/180);
x.clearRect(0,0,c.width,c.height);
x.fillStyle='#14251d';x.fillRect(0,0,900,600);
x.fillStyle='#30333b';x.fillRect(190,0,520,600);
x.fillStyle='#d9d9d9';x.fillRect(184,0,6,600);x.fillRect(710,0,6,600);
x.strokeStyle='#f5f5f5';x.lineWidth=5;x.setLineDash([32,28]);x.lineDashOffset=-(t*speed)%60;
for(let lx of [363,537]){x.beginPath();x.moveTo(lx,0);x.lineTo(lx,600);x.stroke()}x.setLineDash([]);
for(let i=cars.length-1;i>=0;i--){let a=cars[i];a.y+=speed;if(a.y>680)cars.splice(i,1);else drawCar(a)}
if(t%42===0 && cars.length<8){let lane=lanes[Math.floor(Math.random()*3)];cars.push(car(lane,-80))}
let dx=(keys['arrowleft']||keys['a']?-7:0)+(keys['arrowright']||keys['d']?7:0);player.x=Math.max(220,Math.min(680,player.x+dx));
drawCar({...player,col:'#28e07b'});
for(const a of cars){if(Math.abs(a.x-player.x)<40&&Math.abs(a.y-player.y)<66){dead=true;msg.textContent='💥 CRASH!  Press Restart';break}}
requestAnimationFrame(loop)}
start();
</script>
</body>
